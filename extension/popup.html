<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .logo {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, #6366f1, #10b981);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 15px;
    }
    h1 {
      font-size: 14px;
      margin: 0;
      font-weight: 700;
    }
    p {
      font-size: 11px;
      color: #94a3b8;
      margin: 0 0 12px 0;
      line-height: 1.4;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      font-size: 11px;
      margin-bottom: 12px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
      padding: 9px 12px;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      border-radius: 9px;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 8px;
    }
    .btn-sync {
      background: #059669;
    }
    .btn-sync:hover {
      background: #047857;
    }
    .btn-dash {
      background: #4f46e5;
    }
    .btn-dash:hover {
      background: #4338ca;
    }
    .msg-box {
      font-size: 11px;
      padding: 8px;
      border-radius: 8px;
      margin-bottom: 8px;
      display: none;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⚡</div>
    <div>
      <h1>OpenLeet AI</h1>
      <span style="font-size:10px; color:#818cf8;">Socratic Coach & Complexity Targeter</span>
    </div>
  </div>
  <p>Free, open-source alternative to Leet AI ($35/mo). In-page hints, operational budget, and pattern tracking.</p>
  
  <div class="status">
    <div class="dot" id="server-dot"></div>
    <span id="server-status">Checking local server...</span>
  </div>

  <div id="sync-msg" class="msg-box"></div>

  <button id="sync-all-btn" class="btn btn-sync">⚡ Sync All Solved Questions</button>
  <button id="open-app-btn" class="btn btn-dash">Open OpenLeet Dashboard</button>

  <script src="popup.js"></script>
</body>
</html>
