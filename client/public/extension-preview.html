<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asymptote Extension Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: -0.012em;
    }

    body {
      background-color: #f6f8fa;
      color: #334155;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 40px 20px;
    }

    h1, h2, h3, h4, .font-heading {
      font-family: 'Space Grotesk', sans-serif !important;
      font-weight: 700 !important;
      color: #1e2033;
    }

    code, pre, .font-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
      line-height: 1.6;
    }

    /* 400px wide Extension panel with checked background */
    .drawer-panel {
      width: 400px;
      background-color: #f6f8fa;
      background-image: 
        linear-gradient(#e6ebf1 1px, transparent 1px),
        linear-gradient(90deg, #e6ebf1 1px, transparent 1px);
      background-size: 32px 32px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      color: #334155;
      overflow: hidden;
    }

    .drawer-header {
      padding: 14px 16px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
    }

    .tabs-nav {
      display: flex;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 0 8px;
    }

    .tab-btn {
      flex: 1;
      text-align: center;
      padding: 10px 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: #64748b;
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .tab-btn:hover {
      color: #1e2033;
    }
    .tab-btn.active {
      color: #1e2033;
      font-weight: 700;
      border-bottom: 3px solid #10b981;
    }

    .drawer-body {
      padding: 20px 18px;
      flex: 1;
      font-size: 13px;
    }

    .chip-diff {
      display: inline-flex;
      align-items: center;
      font-size: 13px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 9999px;
    }
    .chip-diff-easy {
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #6ee7b7;
    }

    .chip-pattern {
      display: inline-flex;
      align-items: center;
      font-size: 13px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 9999px;
      background: #ffffff;
      color: #475569;
      border: 1px solid #e2e8f0;
    }

    .card-white {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .code-preview-light {
      background: #f6f8fa;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      line-height: 1.6;
      color: #1e2033;
      overflow-x: auto;
      white-space: pre;
    }

    .btn-secondary {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      color: #1e2033;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-secondary:hover {
      background: #f6f8fa;
      border-color: #cbd5e1;
    }

    .btn-amber-reveal {
      width: 100%;
      background-color: #f59e0b;
      color: #1e2033;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s ease;
    }
    .btn-amber-reveal:hover {
      background-color: #d97706;
    }

    .select-clean {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 6px 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: #1e2033;
      cursor: pointer;
      outline: none;
    }
  </style>
</head>
<body>

  <!-- 400px Extension Container -->
  <div class="drawer-panel" id="lc-pattern-drawer">
    <!-- Header: white, 28px tile, "Asymptote" wordmark, close button -->
    <div class="drawer-header">
      <div style="display:flex; align-items:center; gap:8px;">
        <img src="/asymptote-icon-small.svg" width="28" height="28" alt="Asymptote" style="border-radius:6px; display:block; flex-shrink:0;" />
        <span style="font-size:18px; font-weight:700; font-family:'Space Grotesk',sans-serif; color:#1e2033; letter-spacing:-0.02em;">Asymptote</span>
      </div>
      <button id="lc-close-drawer" style="background:none; border:none; color:#64748b; cursor:pointer; padding:6px; line-height:1; border-radius:6px; display:flex; align-items:center; justify-content:center;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>

    <!-- Tabs: Hints, Solution, Complexity, Sync with 3px emerald underline -->
    <div class="tabs-nav">
      <button id="tab-btn-hints" class="tab-btn active" onclick="setTab('hints')">Hints</button>
      <button id="tab-btn-solution" class="tab-btn" onclick="setTab('solution')">Solution</button>
      <button id="tab-btn-complexity" class="tab-btn" onclick="setTab('complexity')">Complexity</button>
      <button id="tab-btn-sync" class="tab-btn" onclick="setTab('sync')">Sync</button>
    </div>

    <!-- Body Container -->
    <div class="drawer-body" id="lc-drawer-content">
      <!-- Common Problem Header: "#104", difficulty chip, pattern chip, title in 22px -->
      <div id="problem-header" style="margin-bottom:18px; text-align:left;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap;">
          <span style="font-family:'DM Sans', sans-serif; font-size:13px; font-weight:700; color:#64748b;">#104</span>
          <span class="chip-diff chip-diff-easy">Easy</span>
          <span class="chip-pattern">Tree DFS / Subtree Divide & Conquer</span>
        </div>
        <h2 style="font-family:'Space Grotesk', sans-serif; font-size:22px; font-weight:700; color:#1e2033; line-height:1.25; margin:0;">
          Maximum Depth of Binary Tree
        </h2>
      </div>

      <!-- Tab Content Area -->
      <div id="tab-content"></div>
    </div>
  </div>

  <script>
    let activeTab = 'hints';
    let currentLevel = 1;
    let isLcLoggedIn = true;

    const hints = [
      { level: 1, title: 'The Recognition Signal', content: 'Notice the constraints and problem structure. This problem maps directly to the Tree DFS / Subtree Divide & Conquer pattern (Trees). Ask yourself: What mathematical property prevents an exhaustive or brute-force search?' },
      { level: 2, title: 'State & Subproblem Formulation', content: 'What parameters uniquely define the state at any moment? Consider what information must be maintained as you move from element i to element i + 1.' },
      { level: 3, title: 'Transition Recurrence & Invariants', content: 'How do subproblems transition? Pay attention to edge cases where you must avoid modifying states in-place.' },
      { level: 4, title: 'Blueprint Reference', content: 'def maxDepth(root):\n    if not root: return 0\n    return 1 + max(maxDepth(root.left), maxDepth(root.right))' }
    ];

    const complexity = {
      targetTime: 'O(N)',
      targetSpace: 'O(H)',
      opsBudgetExplanation: 'LeetCode runs in ~1.0 second (~10⁸ CPU ops). At N = 100,000, single DFS traversal passes effortlessly within 15ms.',
      spaceTimeTradeoff: 'Trade stack frame memory (proportional to tree height H) to achieve optimal single-pass traversal without extra heap allocation.',
      interviewerExpectation: 'Articulate both the recursive divide-and-conquer subproblem and the call-stack memory bound for skewed vs balanced trees.'
    };

    function setTab(tab) {
      activeTab = tab;
      document.getElementById('tab-btn-hints').className = 'tab-btn' + (tab === 'hints' ? ' active' : '');
      document.getElementById('tab-btn-solution').className = 'tab-btn' + (tab === 'solution' ? ' active' : '');
      document.getElementById('tab-btn-complexity').className = 'tab-btn' + (tab === 'complexity' ? ' active' : '');
      document.getElementById('tab-btn-sync').className = 'tab-btn' + (tab === 'sync' ? ' active' : '');
      
      const probHdr = document.getElementById('problem-header');
      if (probHdr) probHdr.style.display = (tab === 'sync') ? 'none' : 'block';
      
      render();
    }

    function render() {
      const container = document.getElementById('tab-content');
      
      if (activeTab === 'hints') {
        const rowsHtml = hints.map((h, i) => {
          const isUnlocked = (i + 1) <= currentLevel;
          if (isUnlocked) {
            return `
              <div style="background:#f0fdf4; border:1px solid #a7f3d0; border-radius:10px; padding:14px; margin-bottom:10px;">
                <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
                  <span style="background:#ecfdf5; border:1px solid #a7f3d0; color:#047857; font-size:11px; font-weight:700; padding:2px 6px; border-radius:6px; line-height:1;">
                    Hint ${i + 1}
                  </span>
                  <span style="font-weight:700; font-size:14px; color:#1e2033;">
                    ${h.title}
                  </span>
                </div>
                <div style="font-size:13px; color:#334155; line-height:1.55; white-space:pre-wrap;">${h.content.trim()}</div>
              </div>
            `;
          } else {
            return `
              <div style="background:#ffffff; border:1px solid #e2e8f0; border-radius:10px; padding:12px 14px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between;">
                <div style="display:flex; align-items:center; gap:8px;">
                  <span style="background:#f8fafc; border:1px solid #e2e8f0; color:#64748b; font-size:11px; font-weight:700; padding:2px 6px; border-radius:6px; line-height:1;">
                    Hint ${i + 1}
                  </span>
                  <span style="font-weight:500; font-size:14px; color:#64748b;">
                    ${h.title}
                  </span>
                </div>
                <span style="font-size:12px; color:#64748b; font-weight:500;">
                  Locked
                </span>
              </div>
            `;
          }
        }).join('');

        const nextHintTitle = hints[currentLevel] ? hints[currentLevel].title : 'Next step';
        const hasMore = currentLevel < hints.length;

        container.innerHTML = `
          <div style="margin-bottom:16px;">
            ${rowsHtml}
          </div>
          ${hasMore ? `
            <button class="btn-amber-reveal" onclick="currentLevel++; render();">
              Reveal hint ${currentLevel + 1}: ${nextHintTitle}
            </button>
          ` : `
            <div style="text-align:center; padding:12px; color:#047857; font-size:13px; font-weight:500; background:#ecfdf5; border:1px solid #a7f3d0; border-radius:10px;">
              All hints unlocked
            </div>
          `}
        `;
      } else if (activeTab === 'solution') {
        container.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
            <select class="select-clean" style="flex:1;">
              <option value="scaffold">Blueprint</option>
              <option value="twists">Pattern variation</option>
              <option value="notes">Notes</option>
            </select>
            <select class="select-clean" style="flex:1;">
              <option value="python">Python 3</option>
              <option value="cpp">C++</option>
              <option value="java">Java</option>
              <option value="typescript">TypeScript</option>
              <option value="mysql">MySQL</option>
            </select>
          </div>

          <div class="card-white" style="margin-top:12px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
              <span style="font-family:'Space Grotesk', sans-serif; font-size:14px; font-weight:700; color:#1e2033;">
                Blueprint
              </span>
              <button class="btn-secondary" onclick="this.innerText='Copied'; setTimeout(() => this.innerText='Copy', 2000);">
                Copy
              </button>
            </div>
            <pre class="code-preview-light"><code># Definition for a binary tree node.
# class TreeNode:
#     def __init__(self, val=0, left=None, right=None):
#         self.val = val
#         self.left = left
#         self.right = right

class Solution:
    def maxDepth(self, root: Optional[TreeNode]) -> int:
        if not root:
            return 0
        left_depth = self.maxDepth(root.left)
        right_depth = self.maxDepth(root.right)
        return 1 + max(left_depth, right_depth)</code></pre>
          </div>

          <div style="text-align:center; margin-top:16px;">
            <a href="http://localhost:5173/?tab=solver" target="_blank" style="font-size:13px; color:#1e2033; font-weight:600; text-decoration:none;">
              Open in dashboard editor ↗
            </a>
          </div>
        `;
      } else if (activeTab === 'complexity') {
        container.innerHTML = `
          <!-- Two side-by-side cards: Target time, Target space in Space Grotesk 18px bold -->
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px;">
            <div style="background:#ffffff; border:1px solid #e2e8f0; border-radius:12px; padding:14px;">
              <div style="font-size:13px; color:#64748b; font-weight:500;">Target time</div>
              <div style="font-family:'Space Grotesk',sans-serif; font-size:18px; font-weight:700; color:#1e2033; margin-top:4px;">
                ${complexity.targetTime}
              </div>
            </div>
            <div style="background:#ffffff; border:1px solid #e2e8f0; border-radius:12px; padding:14px;">
              <div style="font-size:13px; color:#64748b; font-weight:500;">Target space</div>
              <div style="font-family:'Space Grotesk',sans-serif; font-size:18px; font-weight:700; color:#1e2033; margin-top:4px;">
                ${complexity.targetSpace}
              </div>
            </div>
          </div>

          <!-- Panel 1: Time limit (rose style) -->
          <div style="background:#fff1f2; border:1px solid #fecdd3; border-radius:10px; padding:14px; margin-bottom:12px;">
            <div style="font-size:14px; font-weight:700; color:#9f1239; margin-bottom:4px;">
              Time limit
            </div>
            <div style="font-size:13px; color:#9f1239; line-height:1.55;">
              ${complexity.opsBudgetExplanation}
            </div>
          </div>

          <!-- Panel 2: Space and time trade-off (white style) -->
          <div style="background:#ffffff; border:1px solid #e2e8f0; border-radius:10px; padding:14px; margin-bottom:12px;">
            <div style="font-size:14px; font-weight:700; color:#1e2033; margin-bottom:4px;">
              Space and time trade-off
            </div>
            <div style="font-size:13px; color:#334155; line-height:1.55;">
              ${complexity.spaceTimeTradeoff}
            </div>
          </div>

          <!-- Panel 3: What interviewers look for (white style) -->
          <div style="background:#ffffff; border:1px solid #e2e8f0; border-radius:10px; padding:14px; margin-bottom:12px;">
            <div style="font-size:14px; font-weight:700; color:#1e2033; margin-bottom:4px;">
              What interviewers look for
            </div>
            <div style="font-size:13px; color:#334155; line-height:1.55;">
              ${complexity.interviewerExpectation}
            </div>
          </div>
        `;
      } else if (activeTab === 'sync') {
        container.innerHTML = `
          <!-- LeetCode Login simulation toggle for testing -->
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; padding:6px 10px; background:#ffffff; border:1px solid #e2e8f0; border-radius:8px;">
            <span style="font-size:11px; font-weight:600; color:#64748b;">LeetCode session test:</span>
            <div style="display:flex; gap:6px;">
              <button 
                onclick="setLcLogin(true)" 
                style="font-size:11px; font-weight:600; padding:3px 8px; border-radius:6px; border:1px solid ${isLcLoggedIn ? '#1e2033' : '#e2e8f0'}; background:${isLcLoggedIn ? '#1e2033' : '#ffffff'}; color:${isLcLoggedIn ? '#ffffff' : '#64748b'}; cursor:pointer;">
                Logged in
              </button>
              <button 
                onclick="setLcLogin(false)" 
                style="font-size:11px; font-weight:600; padding:3px 8px; border-radius:6px; border:1px solid ${!isLcLoggedIn ? '#be123c' : '#e2e8f0'}; background:${!isLcLoggedIn ? '#fff1f2' : '#ffffff'}; color:${!isLcLoggedIn ? '#be123c' : '#64748b'}; cursor:pointer;">
                Logged out
              </button>
            </div>
          </div>

          <!-- User Profile & Sync Status Card -->
          <div style="background:#ffffff; border:1px solid #e2e8f0; border-radius:12px; padding:14px; margin-bottom:12px;">
            <div style="display:flex; align-items:center; gap:10px;">
              <div style="width:32px; height:32px; border-radius:50%; background:#1e2033; color:#ffffff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0;">
                ${isEmptyAccount ? 'N' : 'R'}
              </div>
              <div style="flex:1; min-width:0;">
                <div style="display:flex; align-items:center; justify-content:space-between;">
                  <span style="font-size:14px; font-weight:700; color:#1e2033; font-family:'Space Grotesk', sans-serif;">
                    ${isEmptyAccount ? 'NewUser' : 'Rijul-Sitpure'}
                  </span>
                  <span style="font-size:12px; font-weight:600; color:#047857; background:#ecfdf5; border:1px solid #a7f3d0; padding:2px 8px; border-radius:9999px;">
                    ${isEmptyAccount ? '0%' : '68%'} Coverage
                  </span>
                </div>
                <div style="font-size:12px; color:#64748b; margin-top:2px;">
                  ${isEmptyAccount ? '0 solved • Not synced' : '190 solved • Synced'}
                </div>
              </div>
            </div>

            <div style="display:flex; align-items:center; gap:6px; margin-top:10px; padding-top:10px; border-top:1px solid #f1f5f9;">
              <span class="chip-diff chip-diff-easy">${isEmptyAccount ? '0' : '90'} Easy</span>
              <span style="font-size:12px; font-weight:500; padding:2px 8px; border-radius:9999px; background:#fffbeb; color:#b45309; border:1px solid #fcd34d;">${isEmptyAccount ? '0' : '93'} Med</span>
              <span style="font-size:12px; font-weight:500; padding:2px 8px; border-radius:9999px; background:#fff1f2; color:#be123c; border:1px solid #fda4af;">${isEmptyAccount ? '0' : '7'} Hard</span>
            </div>
          </div>

          <!-- Login Warning Box (displayed when logged out) -->
          ${!isLcLoggedIn ? `
            <div style="background:#fff1f2; border:1px solid #fecdd3; color:#9f1239; padding:10px 12px; border-radius:8px; font-size:12px; margin-bottom:12px; line-height:1.4;">
              <strong>Not signed in to LeetCode.</strong> Please sign in to leetcode.com to sync your solved problems.
            </div>
          ` : ''}

          <!-- Action Buttons -->
          <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:14px;">
            <button 
              id="preview-sync-btn"
              ${!isLcLoggedIn ? 'disabled' : ''}
              style="width:100%; background:#1e2033; color:#ffffff; font-family:'DM Sans', sans-serif; font-size:13px; font-weight:600; padding:10px 14px; border:none; border-radius:8px; cursor:${!isLcLoggedIn ? 'not-allowed' : 'pointer'}; opacity:${!isLcLoggedIn ? '0.5' : '1'}; display:flex; align-items:center; justify-content:center; gap:8px;">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
              </svg>
              <span>Sync all solved problems</span>
            </button>
            <a 
              href="http://localhost:5173" 
              target="_blank"
              style="width:100%; background:#ffffff; color:#1e2033; border:1px solid #e2e8f0; font-family:'DM Sans', sans-serif; font-size:13px; font-weight:500; padding:10px 14px; border-radius:8px; text-decoration:none; text-align:center; box-sizing:border-box; display:flex; align-items:center; justify-content:center; gap:6px;">
              <span>Open in dashboard</span>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                <polyline points="15 3 21 3 21 9"></polyline>
                <line x1="10" y1="14" x2="21" y2="3"></line>
              </svg>
            </a>
          </div>

          <!-- Problem Lookup Card -->
          <div style="background:#ffffff; border:1px solid #e2e8f0; border-radius:12px; padding:14px;">
            <div style="font-size:13px; font-weight:700; color:#1e2033; margin-bottom:8px; display:flex; align-items:center; justify-content:space-between;">
              <span>Problem lookup</span>
              <span style="font-size:11px; font-weight:normal; color:#64748b;"># or slug</span>
            </div>
            <div style="display:flex; gap:6px;">
              <input 
                type="text" 
                placeholder="e.g. 1 or two-sum"
                style="flex:1; background:#ffffff; border:1px solid #cbd5e1; border-radius:8px; padding:7px 10px; font-size:13px; color:#1e2033; outline:none;"
              />
              <button style="background:#1e2033; color:#ffffff; border:none; border-radius:8px; padding:7px 14px; font-size:13px; font-weight:500; cursor:pointer;">
                Lookup
              </button>
            </div>
          </div>
        `;
      }
    }

    function setLcLogin(val) {
      isLcLoggedIn = val;
      render();
    }

    // Support ?tab= and ?logged_in= URL parameters
    const params = new URLSearchParams(window.location.search);
    const tabParam = params.get('tab');
    if (tabParam && ['hints', 'solution', 'complexity', 'sync'].includes(tabParam)) {
      activeTab = tabParam;
    }
    const loginParam = params.get('logged_in');
    if (loginParam === '0' || loginParam === 'false') {
      isLcLoggedIn = false;
    }
    const isEmptyAccount = params.get('empty') === '1' || params.get('empty') === 'true';
