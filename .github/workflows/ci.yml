name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build dataset
      run: npm run build:dataset

    - name: Verify shared copies in sync
      run: npm run check-shared

    - name: Run linter
      run: npm run lint

    - name: Build client and dashboard
      run: npm run build

    - name: Run unit & correctness tests
      run: npm test

    - name: Verify extension bundle artifacts
      run: |
        test -f extension/dashboard/index.html
        test -f extension/data/manifest.json

    - name: Package extension release zip
      run: npm run package:extension
