name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Verify shared copies in sync
      run: npm run check-shared

    - name: Run linter
      run: npm run lint

    - name: Run unit & correctness tests
      run: npm test

    - name: Build client
      run: npm run build
