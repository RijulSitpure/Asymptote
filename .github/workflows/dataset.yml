name: Dataset Validation & Tests

on:
  push:
    branches: [ master, main ]
    paths:
      - 'dataset/**'
      - '.github/workflows/dataset.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'dataset/**'
      - '.github/workflows/dataset.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: leetcode_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: dataset/requirements.txt

    - name: Install Node dependencies
      run: npm ci

    - name: Install Python dependencies
      run: pip install -r dataset/requirements.txt

    - name: Validate dataset schemas & referential integrity
      run: node dataset/tools/validate.js

    - name: Run sandboxed problem tests
      run: node dataset/tools/run-tests.js --ci
      env:
        MYSQL_HOST: 127.0.0.1
        MYSQL_PORT: 3306
        MYSQL_USER: root
        MYSQL_PASSWORD: root
        MYSQL_DATABASE: leetcode_test

    - name: Verify dataset build produces deterministic output
      run: |
        DIR1=$(mktemp -d)
        DIR2=$(mktemp -d)
        node dataset/tools/build.js "$DIR1"
        node dataset/tools/build.js "$DIR2"
        diff -r "$DIR1" "$DIR2"
        rm -rf "$DIR1" "$DIR2"
