name: Release & Dataset Distribution

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'dataset/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify shared copies
        run: npm run check-shared

      - name: Validate dataset schemas
        run: node dataset/tools/validate.js

      - name: Build dataset distribution & verify
        run: |
          npm run build:dataset
          node scripts/verify-dataset-build.js extension/data
          node scripts/verify-dataset-build.js dist-dataset

      - name: Build client dashboard
        run: npm run build

      - name: Run test suite
        run: npm test

      - name: Run linter
        run: npm run lint

      - name: Package extension
        run: npm run package:extension

      - name: Upload dist-dataset Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-dataset
          path: dist-dataset/

      - name: Commit dist-dataset updates to main (if on main push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain dist-dataset/)" ]; then
            git add dist-dataset/
            git commit -m "chore(dataset): compile and update dist-dataset for OTA updates [skip ci]"
            git push origin main
          else
            echo "dist-dataset is already up to date."
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/asymptote-extension.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
